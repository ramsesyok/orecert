name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o orecert.exe
      - name: Prepare artifacts
        run: |
          mkdir dist
          mv orecert.exe dist/
          cp .orecert.yaml README.md dist/
          cp -r profiles docs dist/
          cd dist && zip -r orecert.zip orecert.exe .orecert.yaml README.md profiles docs
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/orecert.zip
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - uses: ncipollo/release-action@v1
        with:
          artifacts: dist/orecert.zip
          generate_release_notes: true
